<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-handwriting { font-family: 'Marck Script', cursive; }
        .font-sans { font-family: 'Nunito', sans-serif; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-rose-50 font-sans text-slate-800 antialiased min-h-screen relative overflow-x-hidden">
    <canvas id="heartCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div id="envelope-screen" class="fixed inset-0 bg-rose-100 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center border-4 border-rose-200">
            <div class="w-20 h-20 bg-rose-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg animate-pulse-slow cursor-pointer hover:scale-105 transition-transform" onclick="openEnvelope()">
                <span class="text-4xl">✉️</span>
            </div>
            <h1 id="envelope-title" class="font-handwriting text-3xl text-rose-600 font-bold mb-3">Тебе письмо ❤️</h1>
            <p id="envelope-subtitle" class="text-rose-400 text-sm mb-6">Нажми на конверт, чтобы открыть</p>
            <button onclick="openEnvelope()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-full hover:bg-rose-600 transition-colors shadow-md">
                Открыть
            </button>
        </div>
    </div>

    <div class="relative z-10 max-w-lg mx-auto px-4 py-8 space-y-8">
        <header class="text-center bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg border border-rose-100">
            <h1 id="main-title" class="font-handwriting text-4xl text-rose-600 font-bold mb-2">Приглашение</h1>
            <p id="intro-text" class="text-slate-600 text-sm">У меня есть кое-что особенное для тебя...</p>
        </header>

        <section class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg border border-rose-100">
            <div class="flex items-center justify-between mb-4">
                <h2 id="story-title" class="font-handwriting text-2xl text-rose-600 font-bold">Наша история</h2>
                <span id="step-indicator" class="text-xs bg-rose-100 text-rose-600 font-bold px-3 py-1 rounded-full">1 / 3</span>
            </div>
            <div id="card-content" class="min-h-[120px] flex items-center justify-center text-center p-4 bg-rose-50/50 rounded-2xl border border-rose-100 mb-4">
                <p id="card-text" class="text-slate-700 leading-relaxed font-medium"></p>
            </div>
            <div class="flex gap-3">
                <button id="prev-btn" onclick="prevCard()" class="flex-1 border-2 border-rose-200 text-rose-500 font-bold py-2 rounded-xl disabled:opacity-30">Назад</button>
                <button id="next-btn" onclick="nextCard()" class="flex-1 bg-rose-500 text-white font-bold py-2 rounded-xl shadow-md hover:bg-rose-600">Далее</button>
            </div>
        </section>

        <section class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg border border-rose-100 text-center">
            <h2 class="font-handwriting text-3xl text-rose-600 font-bold mb-4">До встречи осталось:</h2>
            <div class="grid grid-cols-4 gap-2 text-center" id="timer">
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100"><span id="days" class="block text-2xl font-bold text-rose-600">00</span><span class="text-xs text-rose-400">дней</span></div>
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100"><span id="hours" class="block text-2xl font-bold text-rose-600">00</span><span class="text-xs text-rose-400">часов</span></div>
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100"><span id="minutes" class="block text-2xl font-bold text-rose-600">00</span><span class="text-xs text-rose-400">минут</span></div>
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100"><span id="seconds" class="block text-2xl font-bold text-rose-600">00</span><span class="text-xs text-rose-400">секунд</span></div>
            </div>
        </section>

        <section class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg border border-rose-100 space-y-4">
            <h2 class="font-handwriting text-3xl text-rose-600 font-bold text-center">Детали</h2>
            <div class="flex items-start gap-4 p-3 bg-rose-50/50 rounded-2xl">
                <span class="text-2xl">📍</span>
                <div><h3 class="font-bold text-rose-600 text-sm">Место</h3><p id="loc-text" class="text-slate-600 text-sm"></p></div>
            </div>
            <div class="flex items-start gap-4 p-3 bg-rose-50/50 rounded-2xl">
                <span class="text-2xl">👗</span>
                <div><h3 class="font-bold text-rose-600 text-sm">Дресс-код</h3><p id="dress-text" class="text-slate-600 text-sm"></p></div>
            </div>
        </section>

        <section class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-lg border border-rose-100 text-center relative min-h-[220px]">
            <h2 class="font-handwriting text-3xl text-rose-600 font-bold mb-2">Ты пойдешь со мной?</h2>
            <p class="text-xs text-slate-400 mb-6">Жду твоего ответа!</p>
            <div class="flex justify-center items-center gap-4 h-16 relative">
                <button onclick="acceptInvite()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-8 py-3 rounded-full shadow-lg transform hover:scale-105 transition-all text-lg">
                    Да! ❤️
                </button>
                <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()" class="bg-slate-200 text-slate-600 font-bold px-6 py-3 rounded-full transition-all text-sm absolute">
                    Подумаю 🙈
                </button>
            </div>
            <div id="success-msg" class="hidden mt-4 p-4 bg-emerald-50 text-emerald-700 font-bold rounded-2xl border border-emerald-200 animate-bounce">
                Ура! Я очень жду нашей встречи! 🎉✨
            </div>
        </section>
    </div>

    <script src="config.js"></script>
    <script>
        let currentStep = 0;
        let config = getConfig();

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('main-title').innerText = config.title;
            document.getElementById('intro-text').innerText = config.introText;
            document.getElementById('story-title').innerText = config.storyTitle;
            document.getElementById('loc-text').innerText = config.location;
            document.getElementById('dress-text').innerText = config.dressCode;
            updateCard();
            startTimer();
            initHearts();
            resetNoButton();
        });

        function openEnvelope() {
            document.getElementById('envelope-screen').classList.add('hidden');
        }

        function updateCard() {
            const cards = config.storyCards;
            document.getElementById('card-text').innerText = cards[currentStep].text;
            document.getElementById('step-indicator').innerText = `${currentStep + 1} / ${cards.length}`;
            document.getElementById('prev-btn').disabled = currentStep === 0;
            document.getElementById('next-btn').innerText = currentStep === cards.length - 1 ? "Завершить" : "Далее";
        }

        function nextCard() {
            if (currentStep < config.storyCards.length - 1) {
                currentStep++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentStep > 0) {
                currentStep--;
                updateCard();
            }
        }

        function resetNoButton() {
            const btn = document.getElementById('no-btn');
            btn.style.left = '60%';
            btn.style.top = '50%';
            btn.style.transform = 'translateY(-50%)';
        }

        function moveNoButton() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth < 400 ? 120 : 200) - 100;
            const y = Math.random() * 100 - 50;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function acceptInvite() {
            confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            document.getElementById('success-msg').classList.remove('hidden');
        }

        function startTimer() {
            function update() {
                const diff = new Date(config.date) - new Date();
                if (diff <= 0) return;
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                document.getElementById('minutes').innerText = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
                document.getElementById('seconds').innerText = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
            }
            update();
            setInterval(update, 1000);
        }

        function initHearts() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const hearts = Array.from({ length: 25 }, () => ({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 100,
                size: Math.random() * 12 + 8,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.5 + 0.3
            }));
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(h => {
                    h.y -= h.speed;
                    if (h.y < -20) { h.y = canvas.height + 20; h.x = Math.random() * canvas.width; }
                    ctx.globalAlpha = h.opacity;
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = `${h.size}px serif`;
                    ctx.fillText('❤️', h.x, h.y);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
