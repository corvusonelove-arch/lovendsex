<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления приглашением</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-pink-400">⚙️ Настройка приглашения</h1>
        
        <form id="admin-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Главный заголовок</label>
                <input type="text" id="title" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Подзаголовок / Текст</label>
                <textarea id="subtitle" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-pink-500"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Дата и время встречи</label>
                <input type="datetime-local" id="date" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Место проведения</label>
                <input type="text" id="location" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-pink-500">
            </div>

            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-pink-600/30">
                Сохранить изменения
            </button>
        </form>

        <div id="status" class="mt-4 text-center text-sm text-green-400 hidden">Сохранено успешно! ✨</div>
        
        <div class="mt-6 pt-4 border-t border-slate-700 text-center">
            <a href="index.html" target="_blank" class="text-pink-400 hover:underline text-sm">Открыть сайт-приглашение →</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Заполняем форму текущими данными при загрузке
        const config = getConfig();
        document.getElementById('title').value = config.title;
        document.getElementById('subtitle').value = config.subtitle;
        document.getElementById('date').value = config.date;
        document.getElementById('location').value = config.location;

        // Сохранение при отправке формы
        document.getElementById('admin-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newConfig = {
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                date: document.getElementById('date').value,
                location: document.getElementById('location').value
            };

            localStorage.setItem('inviteConfig', JSON.stringify(newConfig));
            
            const status = document.getElementById('status');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
        });
    </script>
</body>
</html>
